openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
  - url: https://dogsweb.duckdns.org
    description: Generated server url
paths:
  /api/v1/breeds/{id}:
    get:
      tags:
        - breed-controller
      operationId: getBreedById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BreedResponse'
    put:
      tags:
        - breed-controller
      operationId: updateBreed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBreedRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BreedResponse'
  /api/v1/breeds/{breedId}/subbreeds/{id}:
    get:
      tags:
        - sub-breed-controller
      operationId: getSubBreedById
      parameters:
        - name: breedId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
