                $ref: '#/components/schemas/SubBreedResponse'
  /api/v1/breeds/import:
    post:
      tags:
        - breed-controller
      operationId: importBreeds
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BreedResponse'
  /api/v1/breeds/{id}/{version}:
    delete:
      tags:
        - breed-controller
      operationId: deleteBreed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
