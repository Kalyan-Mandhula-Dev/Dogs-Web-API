openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
  - url: https://dogsweb.duckdns.org
    description: Generated server url
paths:
  /api/v1/breeds/{id}:
    get:
      tags:
        - breed-controller
      operationId: getBreedById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BreedResponse'
    put:
      tags:
        - breed-controller
      operationId: updateBreed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBreedRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BreedResponse'
    delete:
      tags:
        - breed-controller
      operationId: deleteBreed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: version
          in: query
          description: The version you last read. If it is old, the delete fails with 409 Conflict.
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: No Content
  /api/v1/breeds/{breedId}/subbreeds/{id}:
    get:
      tags:
        - sub-breed-controller
      operationId: getSubBreedById
      parameters:
        - name: breedId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubBreedResponse'
    put:
      tags:
        - sub-breed-controller
      operationId: updateSubBreed
      parameters:
        - name: breedId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubBreedRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubBreedResponse'
    delete:
      tags:
        - sub-breed-controller
      operationId: deleteSubBreed
      parameters:
        - name: breedId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: version
          in: query
          description: The version you last read. If it is old, the delete fails with 409 Conflict.
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: No Content
  /api/v1/breeds:
    get:
      tags:
        - breed-controller
      operationId: getBreeds
      parameters:
        - name: lastId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BreedResponse'
    post:
      tags:
        - breed-controller
      operationId: createBreed
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBreedRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BreedResponse'
  /api/v1/breeds/{breedId}/subbreeds:
    get:
      tags:
        - sub-breed-controller
      operationId: getSubBreeds
      parameters:
        - name: breedId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: lastId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubBreedResponse'
    post:
      tags:
        - sub-breed-controller
      operationId: createSubBreed
      parameters:
        - name: breedId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubBreedRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubBreedResponse'
  /api/v1/breeds/import:
    post:
      tags:
        - breed-controller
      operationId: importBreeds
      summary: Import breeds from a dogs.json file
      description: |
        Checks the whole file first. If any data is invalid (bad JSON, blank or
        too-long names, duplicate breeds or sub-breeds in the file), the whole
        file is rejected with 400, the message names the first problem, and
        nothing is saved. If the file is valid, new breeds are saved and breeds
        that already exist are skipped.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        '200':
          description: Import summary
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ImportBreedsResponse'
        '400':
          description: Invalid file. Nothing was saved.
components:
  schemas:
    ImportBreedsResponse:
      type: object
      properties:
        imported:
          type: integer
          description: Number of new breeds saved
        skipped:
          type: integer
          description: Number of breeds skipped because they already exist
        skippedBreeds:
          type: array
          description: Names of the skipped breeds
          items:
            type: string
      example:
        imported: 2
        skipped: 1
        skippedBreeds:
          - hound
    UpdateBreedRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        version:
          type: integer
          format: int32
      required:
        - name
        - version
    BreedResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        version:
          type: integer
          format: int32
        subBreeds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
    UpdateSubBreedRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        version:
          type: integer
          format: int32
      required:
        - name
        - version
    SubBreedResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        version:
          type: integer
          format: int32
        parentBreedId:
          type: integer
          format: int64
        parentBreedName:
          type: string
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
    CreateBreedRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        subBreeds:
          type: array
          items:
            type: string
            maxLength: 100
            minLength: 0
      required:
        - name
    CreateSubBreedRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
      required:
        - name
