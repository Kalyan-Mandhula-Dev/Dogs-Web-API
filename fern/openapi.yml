      operationId: deleteSubBreed
      parameters:
        - name: breedId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: version
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
