              schema:
                $ref: '#/components/schemas/SubBreedResponse'
    put:
      tags:
        - sub-breed-controller
      operationId: updateSubBreed
      parameters:
        - name: breedId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubBreedRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubBreedResponse'
  /api/v1/breeds:
    get:
      tags:
        - breed-controller
      operationId: getBreeds
      parameters:
        - name: lastId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BreedResponse'
    post:
      tags:
        - breed-controller
      operationId: createBreed
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBreedRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BreedResponse'
  /api/v1/breeds/{breedId}/subbreeds:
    get:
      tags:
        - sub-breed-controller
      operationId: getSubBreeds
      parameters:
        - name: breedId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: lastId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubBreedResponse'
    post:
      tags:
        - sub-breed-controller
      operationId: createSubBreed
      parameters:
        - name: breedId
          in: path
          required: true
          schema:
