
services:

  mysql:
    image: mysql:8.0
    container_name: dogs-database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dogs_db
      MYSQL_USER: ${DATABASE_USERNAME}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  dogs-api:
    build: ./dogs-api
    container_name: dogs-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dogs_db
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
      DOGS_UI_URL: ${DOGS_UI_URL}
      GIT_COMMIT: ${GIT_COMMIT:-local}
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  dogs-ui:
    build: ./dogs-ui
    container_name: dogs-ui
    restart: unless-stopped
    depends_on:
      - dogs-api
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  caddy-service:
    image: caddy:2
    container_name: caddy-service
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - dogs-api
      - dogs-ui



volumes:
  mysql_data:
  caddy_data:
